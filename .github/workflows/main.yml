name: cda_offline_skf
run-name: "${{ (inputs.data_referencia != '' || inputs.data_inicio != '' || inputs.etapas != '') && 'reprocessamento' || 'carga diária' }}"

on:
  schedule:
    # 3 tentativas por dia (o agendador do GitHub atrasa e às vezes descarta
    # disparos). Só a primeira roda de fato: as outras param na trava
    # .github/ja_rodou_hoje.py. Horários de Brasília: 03:13, 07:13, 11:13.
    - cron: '13 6 * * *'
    - cron: '13 10 * * *'
    - cron: '13 14 * * *'
  workflow_dispatch:
    inputs:
      data_referencia:
        description: 'Dia a (re)processar nas cargas incrementais, AAAA-MM-DD (vazio = ontem)'
        required: false
        default: ''
      data_inicio:
        description: 'Reprocessar período: data inicial AAAA-MM-DD (usar junto com data_fim)'
        required: false
        default: ''
      data_fim:
        description: 'Reprocessar período: data final AAAA-MM-DD'
        required: false
        default: ''
      etapas:
        description: 'Rodar só estas etapas, separadas por vírgula (vazio = todas)'
        required: false
        default: ''

# Nunca roda duas execuções ao mesmo tempo (evita escrita concorrente nas planilhas)
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Trava (já rodou hoje?)
        id: trava
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/ja_rodou_hoje.py

      - name: Configurar Python
        if: steps.trava.outputs.pular != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Instalar dependências
        if: steps.trava.outputs.pular != 'true'
        run: pip install -r requirements.txt

      - name: Executar script
        if: steps.trava.outputs.pular != 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SKF_KEY: ${{ secrets.SKF_KEY }}
          SKF_SHORTNAMES: ${{ secrets.SKF_SHORTNAMES }}
          SKF_URL: ${{ secrets.SKF_URL }}
          DATA_REFERENCIA: ${{ inputs.data_referencia }}
          DATA_INICIO: ${{ inputs.data_inicio }}
          DATA_FIM: ${{ inputs.data_fim }}
          ETAPAS: ${{ inputs.etapas }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          PYTHONUNBUFFERED: '1'
        run: python cda_offline_skf.py
